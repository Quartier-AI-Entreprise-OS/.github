name: Feature request
description: Propose a new capability or an improvement to an existing one
labels: ["type: feature"]
body:
  - type: markdown
    attributes:
      value: |
        A Feature is something to build: a new capability or an improvement to an existing one.
  - type: textarea
    id: problem
    attributes:
      label: Problem or user need
      description: Who needs this, what they are trying to do, and why it matters now.
      placeholder: Dispatchers need to ... because ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How it should work from the user's point of view.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - api
        - web
        - worker
        - mobile
        - package (domain package)
        - infra / CI
        - docs
        - cross-cutting
    validations:
      required: true

  - type: input
    id: package
    attributes:
      label: Package or module
      placeholder: fleet

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Blocking = a client, contract or deadline depends on it. Important = planned for the next release. Nice to have = whenever there is room.
      options:
        - blocking
        - important
        - nice to have
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in and what is explicitly out.
      placeholder: |
        In:
        - ...
        Out:
        - ...

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable conditions the PR must satisfy. Each item should be verifiable.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: design
    attributes:
      label: Mockups or design links
      description: Figma links, screenshots, sketches.

  - type: textarea
    id: notes
    attributes:
      label: Technical notes or approach
      description: Files to touch, patterns to follow, constraints, things to avoid. Helpful when an agent picks this up.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: impact
    attributes:
      label: Impact
      description: Tick what this feature will touch. The same list appears in the PR template.
      options:
        - label: Database schema or Drizzle migration
        - label: API or tRPC contract change
        - label: New or changed i18n strings
        - label: Mobile app affected
        - label: Env vars, infra or CI change
        - label: Documentation update
